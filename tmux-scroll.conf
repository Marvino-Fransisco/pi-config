# Preserve native app mouse handling and tmux copy mode. Fullscreen apps
# without mouse reporting (including Pi in this session) receive page keys.
bind-key -T root WheelUpPane if-shell -F -t = '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { if-shell -F -t = '#{alternate_on}' { send-keys -t = PageUp } { copy-mode -e -t = } }
bind-key -T root WheelDownPane if-shell -F -t = '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { if-shell -F -t = '#{alternate_on}' { send-keys -t = PageDown } }
